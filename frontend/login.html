<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Bus Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="theme-light">
  <main class="login-wrap">
    <div class="login-card">
      <h1>Bus Tracker</h1>
      <p class="muted">Sign in to see how full your bus is.</p>
      <form id="login-form" novalidate>
        <label>Username
          <input id="username" name="username" type="text" autocomplete="username" required>
        </label>
        <label>Password
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="field-error" role="alert" hidden></p>
        <button id="login-btn" class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>
    </div>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
