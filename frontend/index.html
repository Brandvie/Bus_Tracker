<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How full is my bus? - DkIT Bus Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="theme-light passenger">
  <a class="skip-link" href="#main">Skip to bus status</a>
  <header class="topbar">
    <div>
      <p class="eyebrow">Bus Tracker</p>
      <h1 class="passenger-title">How full is my bus?</h1>
    </div>
    <button id="logout" class="btn btn-small" type="button">Sign out</button>
  </header>

  <main id="main">
    <p id="notice" class="notice" role="status" hidden></p>
    <div id="buses" aria-live="polite"></div>
    <section class="other-buses" id="other-section" hidden>
      <h2>Other buses</h2>
      <ul class="bus-list" id="other-list"></ul>
    </section>
  </main>

  <footer class="passenger-footer">
    <button id="refresh" class="btn btn-block" type="button">Refresh now</button>
    <p id="updated" class="muted">Waiting for data...</p>
  </footer>
  <script type="module" src="js/passenger.js"></script>
</body>
</html>
